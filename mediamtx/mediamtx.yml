logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']

paths:
  cam1:
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 30s

  cam2:
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 30s

  cam3:
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 30s
