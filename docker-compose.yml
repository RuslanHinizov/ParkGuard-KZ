services:
  # Redis — alarm pub/sub ve cache
  redis:
    image: redis:alpine
    container_name: parkguard-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # MediaMTX — RTSP → HLS bridge (opsiyonel)
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: parkguard-mediamtx
    env_file:
      - .env
    environment:
      - MTX_PATHS_CAM1_SOURCE=${CAMERA_1_URL}
      - MTX_PATHS_CAM1_SOURCEONDEMAND=yes
      - MTX_PATHS_CAM1_SOURCEONDEMANDCLOSEAFTER=30s
      - MTX_PATHS_CAM2_SOURCE=${CAMERA_2_URL}
      - MTX_PATHS_CAM2_SOURCEONDEMAND=yes
      - MTX_PATHS_CAM2_SOURCEONDEMANDCLOSEAFTER=30s
      - MTX_PATHS_CAM3_SOURCE=${CAMERA_3_URL}
      - MTX_PATHS_CAM3_SOURCEONDEMAND=yes
      - MTX_PATHS_CAM3_SOURCEONDEMANDCLOSEAFTER=30s
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "8189:8189/udp" # WebRTC ICE/UDP
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./mediamtx/mediamtx.yml
        target: /mediamtx.yml

  # Backend — FastAPI + GPU inference
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parkguard-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env                          # CAMERA_1_URL, CAMERA_2_URL, CAMERA_3_URL
    environment:
      - REDIS_URL=redis://redis:6379  # Docker içi Redis adresi (.env'i override eder)
    volumes:
      - ./backend/data:/app/data          # alarm DB, zone JSON, settings
      - ./backend/config.py:/app/config.py  # kamera URL'leri mount et
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Frontend — React + Nginx (reverse proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parkguard-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  redis-data:
